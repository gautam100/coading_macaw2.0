<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Numbers</title>
</head>
<body>
    <table>
        <tr>
            <td>Enter First Number</td>
            <td><input type="number" id="first_num" /></td>
        </tr>
        <tr>
            <td>Enter Second Number</td>
            <td><input type="number" id="second_num" /></td>
        </tr>
        <tr>
            <td colspan="2">
                <button onclick="doSum()">Add</button>
            </td>
        </tr>
    </table>
    <div id="result"></div>
    <script>
        //Named function
        function doSum(){
            let num1 = document.getElementById("first_num").value
            let num2 = document.getElementById("second_num").value
            let sum = parseInt(num1)+parseInt(num2)
            //document.getElementById("result").innerHTML = "<h1>Sum is:"+sum+"</h1>"
            document.getElementById("result").innerHTML = `<h1>Sum is:${sum}</h1>`
        }
    </script>
</body>
</html>
