<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bullets</title>
</head>
<body>
    <!--ul: unordered list-->
    <!--Li: list item-->
    <h3>Front-end</h3>
    <ul type="disc">
        <li>HTML</li>
        <li>
            CSS
            <ol>
                <li>Bootstrap</li>
                <li>Tailwind</li>
            </ol>
        </li>
        <li>
            JavaScript
            <ul>
                <li>React</li>
                <li>Angular</li>
            </ul>
        </li>
    </ul>
    <hr /><!--Horizontal rular-->
    <br /><!--break-->
    <!--ol: ordered list-->
    <h3>Back-end</h3>
    <ol type="a">
        <li>Node</li>
        <li>Express</li>
        <li>Java</li>
        <li>Django</li>
        <li>Mongodb</li>
        <li>Mysql</li>
    </ol>
</body>
</html>
