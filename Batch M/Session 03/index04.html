<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple If</title>
</head>
<body>
    <select id="weekday" onchange="getDayMsg()">
        <option value="">Select</option>
        <option value="mon">Monday</option>
        <option value="tue">Tuesday</option>
        <option value="wed">Wednesday</option>
        <option value="thru">Thrusday</option>
        <option value="fri">Friday</option>
        <option value="sat">Saturday</option>
        <option value="sun">Sunday</option>
    </select>
    <div id="result"></div>
    <script>
        function getDayMsg(){
            let wd = document.getElementById("weekday").value
            let elem = document.getElementById("result")
            if(wd === "mon"){
                elem.innerHTML = "<h1>This is first day of week</h1>"
            }else if(wd === "tue"){
                elem.innerHTML = "<h1>This is second day of week</h1>"
            }else if(wd === "wed"){
                elem.innerHTML = "<h1>This is third day of week</h1>"
            }else if(wd === "thrus"){
                elem.innerHTML = "<h1>This is fourth day of week</h1>"
            }else if(wd === "fri"){
                elem.innerHTML = "<h1>This is fifth day of week</h1>"
            }else if(wd === "sat"){
                elem.innerHTML = "<h1>This is weekend!</h1>"
            }else if(wd === "sun"){
                elem.innerHTML = "<h1>This is sunday, weekend!</h1>"
            }else{
                elem.innerHTML = "<h1>Pls choose a day from drop down!</h1>"
            }
        }
    </script>
</body>
</html>
