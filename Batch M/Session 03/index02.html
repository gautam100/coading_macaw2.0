<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="first_num" placeholder="Enter First Number" />
    <br /><br />
    <input type="text" id="second_num" placeholder="Enter Second Number" />
    <br /><br />
    <button onclick="doAdd()">Add</button>
    <div id="result">...</div>
    <script>
      //variable: container
      // let | const | var
      function doAdd() {
        let num1 = document.getElementById("first_num").value
        let num2 = document.getElementById("second_num").value
        let sum = parseInt(num1) + parseInt(num2)
        //document.getElementById("result").innerHTML = "<h1>"+sum+"</h1>"
        document.getElementById("result").innerHTML = `<h1>${sum}</h1>`
      }
    </script>
  </body>
</html>
