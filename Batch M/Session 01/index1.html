<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Second HTML</title>
</head>
<body>
    <table align="center" border="1" cellpadding="5" cellspacing="0">
        <tr><!--tr: table row-->
            <th>Sr. No</th><!--th: table heading-->
            <th>Name</th>
            <th>Department</th>
            <th>Designation</th>
        </tr>
        <tr>
            <td>1</td> <!--table data-->
            <td>John</td>
            <td>Sales</td>
            <td rowspan="2">Manager</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Smith</td>
            <td>Marketing</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Cynthia</td>
            <td>IT</td>
            <td>Intern</td>
        </tr>
        <tr>
            <td colspan="4" align="center">
                Thank you!
            </td>
        </tr>
    </table>
</body>
</html>
